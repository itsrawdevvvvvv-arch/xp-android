plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.chaquo.python'
}

android {
    namespace 'ai.xp.editor'
    compileSdk 34

    defaultConfig {
        applicationId "ai.xp.editor"
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // arm64 only: keeps the Python runtime + numpy/Pillow/scipy payload small
        // enough for a 2 GB device and for a single universal APK.
        ndk {
            abiFilters "arm64-v8a"
        }

        python {
            version = "3.11"
            buildPython System.getenv("XP_BUILD_PYTHON") ?: "python3.11"
            pip {
                install "numpy"
                install "pillow"
                // scipy: Chaquopy has no CPython 3.11 arm64 wheel, so XP ships
                // a NumPy-backed scipy package in src/main/python/scipy instead.
            }
        }
    }

    signingConfigs {
        release {
            def ks = System.getenv("XP_KEYSTORE_FILE")
            if (ks != null && file(ks).exists()) {
                storeFile file(ks)
                storePassword System.getenv("XP_KEYSTORE_PASS")
                keyAlias System.getenv("XP_KEY_ALIAS") ?: "xp"
                keyPassword System.getenv("XP_KEYSTORE_PASS")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("XP_KEYSTORE_FILE") != null) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += ["-Xjvm-default=all"]
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        resources {
            excludes += ["/META-INF/{AL2.0,LGPL2.1}", "META-INF/DEPENDENCIES", "META-INF/LICENSE*", "META-INF/NOTICE*"]
        }
    }

    sourceSets {
        main {
            python.srcDirs = ['src/main/python']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.runtime:runtime'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
